name: requests_inspector

description: A Flutter package for logging REST-APIs and GraphQL requests and
  accessing it by Shaking your phone to get the RequestsInspector widget on your
  screen.

version: 4.2.1
homepage: https://github.com/Abdelazeem777/requests_inspector
# we can add screenshots here using screenshots key
# please check this link https://dart.dev/tools/pub/pubspec#screenshots

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  collection: ^1.15.0
  connectivity_plus: ^6.1.2
  dio: ^5.0.0
  flutter:
    sdk: flutter

  collection: ^1.18.0
  dio: ^5.8.0+1
  gql: ^1.0.0+1
  graphql: ^5.1.3
  graphql_flutter: ^5.1.2
  hasura_connect: ^5.0.0+3
  provider: ^6.1.2
  shake: ^2.2.0
  share_plus: ^10.1.4

  sensors_plus: ^6.1.0
  


dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: requests_inspector
      ios:
        default_package: requests_inspector
      macos:
        default_package: requests_inspector
      windows:
        default_package: requests_inspector
      linux:
        default_package: requests_inspector
      web:
        default_package: requests_inspector

